<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

   <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <div class="titulo">
            <h1> Mi instituto </h1>
        </div>
        <div class="botones">
            <a href="index.html" class="btn btn-primary" role="button" aria-disabled="true">INICIO</a>
            <a href="horario.html" class="btn btn-secondary" role="button"  aria-disabled="true">HORARIO</a>
            <a href="formulario.html" class="btn btn-secondary" role="button"  aria-disabled="true">FORMULARIO</a>
        </div>
    </header>

    <!--formulario-->
    <form>
        <div class="container">
        <!--1a columna-->
        <tr>
            <fieldset class="columna_1">
                <legend>DATOS DE CONTACTO</legend>
                <hr><br>
                <input id="email" type="text" class="form-control" placeholder="correo electronico">
                <br>
                <input id="direccion" type="text" class="form-control" placeholder="direccion">
                <br>
                <input id="nombre" type="text" class="form-control" placeholder="nombre">
                <br>
                <input id="apellidos" type="text" class="form-control" placeholder="apellidos">
                <br>
                <input id="telefono" type="text" class="form-control" placeholder="Número de telefono" >
            </fieldset>
        </tr>
       <!--2a columna-->
        <tr>
            <fieldset class="columna_2">
                <legend>DATOS PERSONALES</legend>
                <hr><br>
                <input id="sexo" type="text" class="form-control" placeholder="sexo">
                <br>
                <input id="dni" type="text" class="form-control" placeholder="DNI">
                <br>
                <input id="edad" type="text" class="form-control" placeholder="edad">
                <br>
                <label for="date">Fecha de nacimiento:</label>
                <input type="date" class="form-control" placeholder="fecha de nacimiento" name="date" id="fecha">
                <br>
                <label for="COLOR">Color favorito:</label> 
                <input type="color" class="form-control" placeholder="color favorito" name="color" id="color">
            </fieldset>
        </tr>
        
    </div>
    <div class="formulario_3">
        <fieldset>
            <legend>DATOS DE ESTUDIO</legend>
            <hr><br>
            <div class="ola">
                <!--DESPLEABLES-->
                <select id="provincia" name="provincia">
                    <option value="">Selecciona una provincia</option>
                    <option value="cordoba">Córdoba</option>
                    <option value="ciudad_real">Ciudad Real</option>
                    <option value="toledo">Toledo</option>
                    <option value="jaen">Jaén</option>
                </select>
                <select id="ciclo" name="ciclo">
                    <option value="">Selecciona un ciclo</option>
                    <option value="administracion_de_sistemas_informaticos_en_red">ADMINISTRACION DE SISTEMAS INFORMATICOS EN RED</option>
                    <option value="desarrollo_de_aplicaciones_multiplataforma">DESARROLLO DE APLICACIONES MULTIPLATAFORMA</option>
                    <option value="desarrollo_de_aplicaciones_web">DESARROLLO DE APLICACIONES WEB</option>
                </select>
            </div>
             
        </fieldset>
    </div>
    <div class="boton_enviar">
            <button type="submit" class="btn btn-primary">ENVIAR</button>
    </div> 
    <br>
    <div class="boton_borrar">
        <button type="reset" class="btn btn-danger">BORRAR</button>
    </div>
    </form>

    <!--PIE DE PAGINA-->   
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
            <p class="col-md-4 mb-0 text-body-secondary">Ariel Velasco López</p> 
            <a href="/" class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none" aria-label="Bootstrap"> 
               
            </a> 
            <ul class="nav col-md-4 justify-content-end"> 
                <li class="nav-item_botones"><a href="index.html" class="nav-link px-2 text-body-secondary">INICIO</a></li> 
                <li class="nav-item_botones"><a href="horario.html" class="nav-link px-2 text-body-secondary">HORARIO</a></li> 
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary"></a></li> 
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary"></a></li> 
                <li class="nav-item_botones"><a href="https://cifpvirgendegracia.com/" class="nav-link px-2 text-body-secondary">CIFP VIRGEN DE GRACIA</a></li> 
            </ul> 
    </footer>
</body>
</html>
